[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uncrater"
version = "1.0.0"
description = "LuSEE-Night binary telemetry packet decoder"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "LuSEE-Night Collaboration" },
]
dependencies = [
    "hexdump>=3.3",
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=7.4",
]
vendor = [
    "ctypesgen==1.1.1",
]
plot = [
    "matplotlib>=3.9",
    "scipy>=1.14",
]
lab = [
    "PyYAML>=6.0",
    "pyserial>=3.5",
]
report = [
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[tool.setuptools.packages.find]
include = ["uncrater", "uncrater.*"]

[tool.setuptools.package-data]
"uncrater.coreloop" = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "test/standalone"]
markers = [
    "real_data: tests that require the private CDI corpus",
]
