name: Optional emulator integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coreloop-emulator:
    name: Coreloop emulator tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout exact coreloop source
        uses: actions/checkout@v4
        with:
          repository: lusee-night/coreloop
          ref: 38770b94bd20dfdbf52d1d8b872a716537b851f3
          path: coreloop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install decoder and emulator harness dependencies
        run: python -m pip install ".[lab,plot,vendor]"

      - name: Build pinned coreloop emulator
        run: |
          cmake -S coreloop -B coreloop/build
          cmake --build coreloop/build --parallel

      - name: Run emulator-backed integration tests
        env:
          CORELOOP_DIR: ${{ github.workspace }}/coreloop
        run: |
          python test/cli_driver.py -r alive -b coreloop --skip-report
          python test/cli_driver.py -r time_resolved -b coreloop --skip-report
          python test/cli_driver.py -r data_interface -b coreloop --skip-report
