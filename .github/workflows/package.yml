name: Package distributions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Build and clean-install distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          WHEELS=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#WHEELS[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/uncrater-wheel"
          # Keep checkout files and a stray top-level pycoreloop from masking omissions
          cd "$RUNNER_TEMP"
          unset CORELOOP_DIR
          "$RUNNER_TEMP/uncrater-wheel/bin/python" -m pip install "${WHEELS[0]}"
          "$RUNNER_TEMP/uncrater-wheel/bin/python" -c "import contextlib, importlib.util, io, sys; stdout = io.StringIO(); stderr = io.StringIO(); stack = contextlib.ExitStack(); stack.enter_context(contextlib.redirect_stdout(stdout)); stack.enter_context(contextlib.redirect_stderr(stderr)); import uncrater; import uncrater.Packet_Calibrator; stack.close(); assert stdout.getvalue() == stderr.getvalue() == ''; assert uncrater.appid is uncrater.id; assert uncrater.id.AppID_RawADC == 0x2F0; assert importlib.util.find_spec('pycoreloop') is None; assert 'pycoreloop' not in sys.modules"
          "$RUNNER_TEMP/uncrater-wheel/bin/python" -m pip check

      - name: Verify installed source distribution outside the checkout
        shell: bash
        run: |
          SDISTS=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#SDISTS[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/uncrater-sdist"
          cd "$RUNNER_TEMP"
          unset CORELOOP_DIR
          "$RUNNER_TEMP/uncrater-sdist/bin/python" -m pip install "${SDISTS[0]}"
          "$RUNNER_TEMP/uncrater-sdist/bin/python" -c "import contextlib, importlib.util, io, sys; stdout = io.StringIO(); stderr = io.StringIO(); stack = contextlib.ExitStack(); stack.enter_context(contextlib.redirect_stdout(stdout)); stack.enter_context(contextlib.redirect_stderr(stderr)); import uncrater; import uncrater.Packet_Calibrator; stack.close(); assert stdout.getvalue() == stderr.getvalue() == ''; assert uncrater.appid is uncrater.id; assert uncrater.id.AppID_RawADC == 0x2F0; assert importlib.util.find_spec('pycoreloop') is None; assert 'pycoreloop' not in sys.modules"
          "$RUNNER_TEMP/uncrater-sdist/bin/python" -m pip check
